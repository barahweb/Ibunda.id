services:
    app:
        build:
            context: .
        restart: unless-stopped
        ports:
            - "127.0.0.1:${APP_PORT:-8080}:80"
        env_file:
            - .env.docker
        environment:
            DB_HOST: mysql
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app

    scheduler:
        build:
            context: .
        restart: unless-stopped
        command: ["php", "artisan", "schedule:work"]
        env_file:
            - .env.docker
        environment:
            DB_HOST: mysql
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app

    queue:
        build:
            context: .
        restart: unless-stopped
        command: ["php", "artisan", "queue:work", "--tries=3"]
        env_file:
            - .env.docker
        environment:
            DB_HOST: mysql
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app

    mysql:
        image: mysql:8.0
        restart: unless-stopped
        env_file:
            - .env.docker
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - app

volumes:
    mysql-data:

networks:
    app:
        driver: bridge
